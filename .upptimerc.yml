# Upptime voor Third Place — elke 5 minuten een controle.
# Gaat iets plat, dan opent Upptime een issue in deze repo en mailt GitHub Henk.
owner: aron296
repo: third-place-status

sites:
  - name: Site (home)
    url: https://society.thirdplacerotterdam.nl/
  - name: Zaalverhuur (/the-place)
    url: https://society.thirdplacerotterdam.nl/the-place
  - name: Offertepagina
    url: https://society.thirdplacerotterdam.nl/verhuur/betalen/proef
  # Stripe-webhook: zonder handtekening antwoordt hij 400. Dat betekent: hij draait.
  - name: Betalingen (Stripe-webhook)
    url: https://urhhdbjctoygohagdiqj.supabase.co/functions/v1/stripe-webhook
    expectedStatusCodes:
      - 400
  # Akkoordfunctie: met een nep-token antwoordt hij 404 met deze zin. Dan draait hij.
  - name: Akkoord op offertes
    url: https://urhhdbjctoygohagdiqj.supabase.co/functions/v1/verhuur-betalen
    method: POST
    headers:
      - "Content-Type: application/json"
    body: '{"token":"x","action":"info"}'
    expectedStatusCodes:
      - 404
    __dangerous__body_down_if_text_missing: "Deze link klopt niet"

assignees:
  - aron296

status-website:
  baseUrl: /third-place-status
  logoUrl: https://society.thirdplacerotterdam.nl/email/tps-woordmerk-zwart.png
  name: Third Place status
  navbar:
    - title: Status
      href: /
    - title: Third Place
      href: https://society.thirdplacerotterdam.nl
  introTitle: "Draait alles?"
  introMessage: "Elke 5 minuten gecontroleerd: de site, de zaalverhuur, het betalen en het akkoord op offertes."
  theme: dark

i18n:
  up: "Werkt"
  down: "Plat"
  degraded: "Traag"
